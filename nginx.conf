server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep-alive: закрываем соединение со стороны nginx раньше, чем браузер
    # попытается переиспользовать уже мёртвое — это убирает AxiosError: Request aborted
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;
    send_timeout 60;
    client_header_timeout 60;
    client_body_timeout 60;

    # SPA routing — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;

        # Не кэшировать index.html — браузер всегда должен получать актуальный HTML
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Статику кэшируем агрессивно (vite добавляет хэш в имена файлов)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/font-woff2;
}
